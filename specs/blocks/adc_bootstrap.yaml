block: adc_bootstrap
title: Bootstrapped gate generator for the bottom-plate input switches (one per side)
version: 0.5.0
owner: many-question
status: behavioral
views:
  behav: design/behav/adc_bootstrap.scs
  xtor: design/xtor/adc_bootstrap/adc_bootstrap.scs
summary: >
  While PHI_B is high, VG = VIN + Vboot (Vboot ~ AVDD, from a capacitor charged
  during conversion), so every NMOS input switch inside adc_cdac sees a
  signal-independent gate-source voltage. PHI_B falling turns VG to 0 V quickly
  (the sampling instant itself is set by PHI_S in adc_cdac, 20-80 ps earlier).
  The load is the gate capacitance of all input switches of one CDAC.
ports:
  - {name: VIN,    dir: in,  type: analog, side: left,   desc: "input (switch source side)"}
  - {name: PHI_B,  dir: in,  type: clock,  side: left,   desc: "high = track"}
  - {name: PHI_BB, dir: in,  type: clock,  side: left,   desc: "complement of PHI_B"}
  - {name: VG,     dir: out, type: analog, side: right,  desc: "boosted gate"}
  - {name: AVDD,   dir: supply, type: supply, side: top,    desc: "0.9 V"}
  - {name: VSS,    dir: ground, type: supply, side: bottom, desc: "ground"}
operating:
  vin_range: [0.0, 0.9]
  load: >
    Reference load in the testbench: the input switch of the reference CDAC
    (nch_ulvt_mac, total W = 96 um in 48 fingers, L = 30 nm, sized for 12.5 ohm at Vgs = 0.9 V)
    driving C_S = 2.057 pF (arch v0.3) whose top plate is reset to VCM by an ideal PHI_S
    switch; VG wiring 10 fF.
  soa: "|Vgs|, |Vgd|, |Vds| <= 1.0 V for every thin-oxide device in every corner"
  # BST-09/10 bind the adc_clkgen PHI_B / PHI_BB loads (40 fF each), which drive
  # both bootstraps: 2 x 16 fF + 8 fF (20 %) of wire = 40 fF.
specs:
  - {id: BST-01, name: "VG - VIN during tracking (min over VIN 0..0.9 V)", metric: vgs_min_V, unit: V, min: 0.72, corners: all, test: tb_bootstrap_dc}
  - {id: BST-02, name: "variation of VG - VIN over VIN range",     metric: vgs_var_mV, unit: mV, max: 40, corners: all, test: tb_bootstrap_dc}
  - {id: BST-03, name: "VG fall PHI_B -> VG < 0.1 V",              metric: t_off_ps,   unit: ps, max: 60, corners: all, test: tb_bootstrap_dc}
  - {id: BST-04, name: "VG rise PHI_B -> VG - VIN > 95 %",         metric: t_on_ps,    unit: ps, max: 300, corners: all, test: tb_bootstrap_dc}
  - {id: BST-05, name: "tracking SFDR with reference switch (diff, 49.9 MHz, -1 dBFS, 50 ohm)", metric: sfdr_dBc, unit: dBc, min: 82, corners: all, test: tb_bootstrap_track}
  - {id: BST-06, name: "tracking SNDR excl. kT/C (same)",          metric: sndr_dB,    unit: dB, min: 78, corners: all, test: tb_bootstrap_track}
  - {id: BST-07, name: "average AVDD current at 100 MHz (one instance)", metric: iavg_uA, unit: uA, max: 50, corners: typ, test: tb_bootstrap_dc}
  - {id: BST-09, name: "PHI_B input capacitance (charge per rising edge / VDD)", metric: cin_phb_fF, unit: fF, max: 16, corners: typ, test: tb_bootstrap_dc}
  - {id: BST-10, name: "PHI_BB input capacitance (charge per rising edge / VDD)", metric: cin_phbb_fF, unit: fF, max: 16, corners: typ, test: tb_bootstrap_dc}
  - {id: BST-08, name: "SOA violations: thin-oxide device / terminal pairs over 1.0 V (Vgs, Vgd, Vds; absolute, whole transient)", metric: soa_violations, unit: count, max: 0, corners: all, test: tb_bootstrap_dc}
tests:
  tb_bootstrap_dc:
    netlist: tb/bootstrap/tb_bootstrap_dc.scs
    measure: adcflow.measure.bootstrap:dc
    needs_pdk: true
    soa: {dut: [XDUT], external: [MSWP]}
    desc: >
      100 MHz ideal phases; VIN stepped 0, 0.15 .. 0.9 V (one level per 4
      cycles) through 50 ohm with the reference load. Measures VG - VIN at the
      end of each track phase, turn-on / turn-off times and AVDD current.
      BST-08 is the per-device SOA check of adcflow (docs/verification.md §5):
      the run deck saves the d / g / s nodes of every thin-oxide MOS in XDUT
      and of the reference switch MSWP; |Vgs|, |Vgd| and |Vds| of each, both
      polarities, are taken at every time point of the whole transient (edges
      included) and compared with 1.0 V; soa_violations counts the device /
      terminal pairs above it, soa_table gives every pair's largest |V| and
      its time. A transistor view without such devices, an unlisted MOS model
      or a missing waveform is an error (unverified), never 0. The behavioral
      view has no devices: only MSWP is checked (|VG - VIN|, |VG - BP|,
      |BP - VIN|), recorded as soa_scope external, which is not
      transistor-level evidence. BST-09/10: PHI_B and PHI_BB reach the DUT
      through charge meters (tb_qmeter_va, a 0 V path); the charge a pin draws over each rising edge
      divided by the voltage step, mean over all rising edges (window as in
      adc_cdac tb_cdac_settle).
  tb_bootstrap_track:
    netlist: tb/bootstrap/tb_bootstrap_track.scs
    measure: adcflow.measure.bootstrap:track
    prepare: adcflow.measure.top:prepare
    params: {fin_target: 49.9e6, npts: 256}
    needs_pdk: true
    numerics: {reltol: 1.0e-7, vabstol: 1.0e-8, maxstep: 1p, method: traponly}
    crosscheck: {maxstep: 0.5p, method: gear2only, samples: samples.txt}
    desc: >
      Two bootstraps with reference loads, differential sine from 50 ohm per
      side, coherent 49.9 MHz, -1 dBFS. The bottom-plate voltages at the PHI_S
      falling edges are the samples (bottom-plate sampling); FFT of 256 samples.
      Explicit transient settings (numerics, #28): with the simulator defaults
      a transistor-level switch gave an unconverged 66.7 dB SFDR (about 93.6 dB
      once converged). Convergence cross-check (sim --crosscheck: maxstep 0.5 ps,
      gear2only; docs/verification.md §2) at representative worst corners and
      after substantive design changes.
