block: adc_ref
title: Reference driver (VREFP = 0.9 V) and top-plate common-mode (VCM = 0.45 V)
version: 0.5.0
owner: many-question
status: behavioral
views:
  behav: design/behav/adc_ref.scs
  xtor: design/xtor/adc_ref/adc_ref.scs
summary: >
  Buffers the high-impedance 0.9 V reference input VREF_IN into VREFP, which
  supplies the CDAC drivers (arch v0.3, cu = 1 fF): per conversion 0.93 pC at
  the start (the sampled H halves go from VIN to VREFP) and 13 switch charges
  of w_j * 0.45 fC (0.44 pC for the MSB, <= 14 fC from decision 7 on),
  first-order independent of the code, plus a signal-dependent part
  (-cu * LSB * gain * L^2 / 4, up to 0.36 pC). Everything is on-chip: decoupling in the nF range would have to be
  off-chip and its bond wires are not modelled, so it is not an option. The
  topology, bias current and decap are the designer's choice; the specs only
  constrain VREFP at the instants the comparator uses it (tb_ref_replay) and
  its noise. The behavioral view is an open-loop NMOS follower from AVDD18
  (4 mA, 3 pF decap; v0.2 had 2 mA and 1.5 pF for half the charge, the same
  VREFP waveform) - a starting point, not a requirement. Runs from AVDD18
  because a 0.9 V output cannot be regulated from the 0.9 V rail. VCM
  (0.45 V) resets the top plates during tracking and only sees small
  common-mode charge.
ports:
  - {name: VREF_IN, dir: in,  type: analog, side: left,   desc: "0.900 V reference input, high impedance (< 1 uA)"}
  - {name: VREFP,   dir: out, type: analog, side: right,  desc: "buffered 0.9 V reference for the CDAC"}
  - {name: VCM,     dir: out, type: analog, side: right,  desc: "0.45 V top-plate reset level"}
  - {name: AVDD18,  dir: supply, type: supply, side: top,    desc: "1.8 V supply (thick-oxide devices allowed)"}
  - {name: AVDD,    dir: supply, type: supply, side: top,    desc: "0.9 V supply (bias / VCM if used)"}
  - {name: VSS,     dir: ground, type: supply, side: bottom, desc: "ground (also VREFN)"}
operating:
  load_vrefp: >
    the CDAC charge sequence of a 49.7 MHz -1 dBFS conversion from the system
    model (tb_ref_replay), plus 1.2 pF for the CDAC bottom plates; DC and
    noise tests use the average load load_vrefp_dc
  # A; tb_ref_dc and tb_ref_noise (gen_tb.py) take it from here. The CDAC
  # average of arch v0.3, both sides: 0.93 pC at the start (the sampled H
  # halves, C_S / 2 = 1.03 pF per side, from VIN ~ 0.45 V to VREFP) plus 13
  # switch charges w_j * cu / 2 * VREFP (sum of w_j = 2269: 1.02 pC), together
  # 1.95 pC per conversion; x 100 MHz = 195 uA (v0.2 with cu = 0.5 fF: 100 uA).
  # It covers the 176 uA average of the near-Nyquist replay (tb_ref_replay,
  # npts 1024, 49.707 MHz; the signal-dependent part lowers the average).
  load_vrefp_dc: 200.0e-6
  load_vcm: >
    2 x 2.5 pF switched to top plates at 100 MHz; not applied by any adc_ref
    testbench: VCM is accepted by REF-02 (DC) plus the mixed top-level
    regression (tb_top_sine with the transistor adc_ref), see docs/handoff.md
  power: "no limit; AVDD18 / AVDD currents are reported (lower is better)"
  power_up_sequence: >
    The only supported power-up sequence (issue #34). (1) AVDD and AVDD18 rise
    first, AVDD not later than AVDD18, each ramp >= 1 us, with VREF_IN held at
    0 V. (2) After both supplies have settled, VREF_IN ramps 0 -> 0.9 V in
    >= 10 us. (3) CLK is static (no conversions) until ready, 5 us after
    VREF_IN reaches 0.9 V; conversions are valid only after ready. Every other
    ordering is not supported and not verified: AVDD18 before AVDD, VREF_IN
    present (or rising) while the supplies rise, a VREF_IN step or a ramp
    faster than 10 us, conversions before ready.
  # s; tb_ref_startup (gen_tb.py) is generated from these: both supplies ramp
  # together (the AVDD-not-later limit) in supply_ramp; VREF_IN stays at 0 V
  # for vref_dwell after they are up (a bench condition, longer than the
  # sequence needs, so that a circuit raising VREFP / VCM without a reference
  # shows in REF-15 / REF-17), then ramps in vref_ramp; "ready" is ready
  # after the end of the ramp.
  power_up: {supply_ramp: 1.0e-6, vref_dwell: 5.0e-6, vref_ramp: 10.0e-6, ready: 5.0e-6}
specs:
  - {id: REF-01, name: "VREFP - VREF_IN (DC, 200 uA load)",       metric: vrefp_err_mV, unit: mV, min: -5, max: 5, corners: all, test: tb_ref_dc}
  - {id: REF-02, name: "VCM",                                     metric: vcm_V,        unit: V,  min: 0.44, max: 0.46, corners: all, test: tb_ref_dc}
  - {id: REF-04, name: "VREFP sensitivity to AVDD18 (DC)",        metric: line_mV_per_V, unit: mV/V, max: 5, corners: all, test: tb_ref_dc}
  - {id: REF-08, name: "VREFP noise 10 kHz - 100 GHz (with 1.2 pF CDAC load)", metric: noise_uV, unit: uV, max: 120, corners: typ, test: tb_ref_noise}
  - {id: REF-11, name: "VREF_IN input current",                   metric: iin_uA,       unit: uA, max: 1, corners: all, test: tb_ref_dc}
  - {id: REF-12, name: "ENOB loss from VREFP at the decision instants (charge replay)", metric: enob_loss_bit, unit: bit, max: 0.10, corners: all, test: tb_ref_replay}
  - {id: REF-13, name: "VREFP change over decisions 12..14 (no redundancy), max", metric: tail_dev_uV, unit: uV, max: 200, corners: all, test: tb_ref_replay}
  - {id: REF-14, name: "VREFP before conversion start, p-p over the replay (memory)", metric: start_pp_uV, unit: uV, max: 100, corners: all, test: tb_ref_replay}
  - {id: REF-15, name: "VREFP maximum during the supported power-up (whole run)", metric: vrefp_max_V, unit: V, max: 1.0, corners: all, test: tb_ref_startup}
  - {id: REF-16, name: "VREFP minimum during the supported power-up (whole run)", metric: vrefp_min_V, unit: V, min: -0.1, corners: all, test: tb_ref_startup}
  - {id: REF-17, name: "VCM maximum during the supported power-up (whole run)", metric: vcm_max_V, unit: V, max: 1.0, corners: all, test: tb_ref_startup}
  - {id: REF-18, name: "VCM minimum during the supported power-up (whole run)", metric: vcm_min_V, unit: V, min: -0.1, corners: all, test: tb_ref_startup}
  - {id: REF-19, name: "VREFP from ready to the end: max |VREFP - VREF_IN| (REF-01 at no load)", metric: ready_err_mV, unit: mV, max: 5, corners: all, test: tb_ref_startup}
  - {id: REF-20, name: "VCM from ready to the end: the value furthest from 0.45 V (REF-02 range)", metric: vcm_ready_V, unit: V, min: 0.44, max: 0.46, corners: all, test: tb_ref_startup}
tests:
  tb_ref_dc:
    netlist: tb/ref/tb_ref_dc.scs
    measure: adcflow.measure.ref:dc
    desc: >
      DC operating point with the 200 uA average CDAC load (load_vrefp_dc):
      REF-01, REF-02 and REF-11 there, REF-04 from a sweep of AVDD18 +/-10 % at
      that load; a dc sweep of the load 0..200 uA is characterization (load
      regulation, reported, no limit); supply currents are reported.
  tb_ref_replay:
    netlist: tb/ref/tb_ref_replay.scs
    measure: adcflow.measure.ref:replay
    prepare: adcflow.measure.ref:replay_prepare
    params: {npts: 1024, nwarm: 32, fin_target: 49.7e6}
    desc: >
      The system model converts a coherent 49.7 MHz -1 dBFS sine (1024 + 32
      conversions, ideal reference, TT ADC timing - the shortest decision
      spacing); its start charge and 13 switch charges per conversion are
      played into VREFP as 20 ps current pulses (iload.pwl) and VREFP is
      sampled at every comparator clock and just before every conversion
      start (trig.pwl -> vdec.txt). The sampled deviations are fed back into
      the same model conversion: REF-12 is the ENOB lost against an ideal
      reference. REF-13 is the change over the last three decisions, which
      have no redundancy (decisions 8..11 tolerate 2.0 / 1.2 / 0.4 / 0.4 mV).
      Transient noise is off; noise is REF-08.
  tb_ref_noise:
    netlist: tb/ref/tb_ref_noise.scs
    measure: adcflow.measure.ref:noise
    desc: >
      Small-signal noise of VREFP (and VCM) from 1 kHz to 100 GHz with the
      decoupling, the 1.2 pF CDAC load and the 200 uA average load. VREFP noise
      multiplies the signal (input-referred ~0.7 x at -1 dBFS): 80 / 120 /
      160 / 300 uV rms cost 0.06 / 0.12 / 0.20 / 0.49 bit. REF-08 integrates
      from 10 kHz, about one bin of a long (8k-16k point) record; noise below
      that is a slow gain wander, reported as noise_lf_uV (1 - 10 kHz) with no
      limit, and noise_total_uV is the whole band.
  tb_ref_startup:
    netlist: tb/ref/tb_ref_startup.scs
    measure: adcflow.measure.ref:startup
    numerics: {maxstep: 1n}
    crosscheck: {maxstep: 0.1n, method: gear2only}
    desc: >
      The supported power-up sequence (power_up_sequence): AVDD and AVDD18
      ramp together from 0.1 to 1.1 us with VREF_IN at 0 V; VREF_IN stays at
      0 V for 5 us more (vref_dwell), then ramps 0 -> 0.9 V from 6.1 to
      16.1 us; ready at 21.1 us; the run ends at 25.1 us. Loads:
      1.2 pF on VREFP (CDAC bottom plates, as tb_ref_replay / tb_ref_noise)
      and 2 x 2.5 pF on VCM (the two top plates, C_tot); no DC load (CLK is
      static, no conversions). REF-15..18: the largest and smallest VREFP and
      VCM over the whole run, against -0.1 .. 1.0 V, the window the thin-oxide
      CDAC and comparator devices on these nets need; the dwell with VREF_IN
      at 0 V lets a circuit that raises its outputs without a reference show
      there. REF-19: the largest |VREFP - VREF_IN| from ready to the end, the
      REF-01 tolerance at no load, so a reference that settles late or does
      not start fails. REF-20: the VCM value furthest from 0.45 V from ready
      to the end, against the REF-02 range. Reported: the largest VREFP and
      VCM during the dwell, the largest |VREFP - VREFP(end)| from ready on,
      the final VREFP - VREF_IN, VCM at the end, the largest
      |VREFP - VREF_IN| during the VREF_IN ramp and the time after the ramp
      from which VREFP stays within 5 mV of VREF_IN. The
      per-device SOA check is not applied: the thin-oxide limit does not
      apply to the thick-oxide devices of adc_ref. The behavioral view's
      follower and VCM driver are ideal current sources that do not depend
      on AVDD18 / AVDD, so it shows the VREF_IN ramp and the settling, not
      supply headroom or bias start-up.
