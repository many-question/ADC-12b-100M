block: adc_comp
title: Dynamic latched comparator
version: 0.5.0
selected: none          # the selected candidate (design/xtor/<block>/<name>/); none yet
status: behavioral
views:
  behav: design/behav/adc_comp.scs
summary: >
  Single fully-dynamic comparator of the asynchronous SAR loop. CLKC low resets
  (OUTP = OUTN = 0); CLKC rising evaluates; exactly one of OUTP / OUTN rises.
  OUTP = 1 means V(INP) > V(INN). At the top level INP is driven by the top
  plate of the CDAC that samples VINN (bottom-plate sampling inverts), so
  OUTP = 1 means "input above the DAC level".
ports:
  - {name: INP,  dir: in,     type: analog,  side: left,   desc: "positive input (top plate TOPN)"}
  - {name: INN,  dir: in,     type: analog,  side: left,   desc: "negative input (top plate TOPP)"}
  - {name: CLKC, dir: in,     type: clock,   side: bottom, desc: "comparator clock from SAR logic; 0 = reset, 1 = evaluate"}
  - {name: OUTP, dir: out,    type: digital, side: right,  desc: "1 when INP > INN (return-to-zero)"}
  - {name: OUTN, dir: out,    type: digital, side: right,  desc: "1 when INP < INN (return-to-zero)"}
  - {name: AVDD, dir: supply, type: supply,  side: top,    desc: "0.9 V analog supply"}
  - {name: VSS,  dir: ground, type: supply,  side: bottom, desc: "ground"}
operating:
  input_cm: [0.40, 0.56]      # V; the top-plate CM is ~0.49 V
  input_diff_max: 0.8         # V; the first comparison can see ~0.75 V
  load_per_output: 10.0e-15   # F; SAR logic input (adc_sarlogic LOG-15, 7 fF) + 3 fF wire
  # CLKC (CMP-14) is the adc_sarlogic CLKC load load_clkc (20 fF): 16 fF + 4 fF of wire.
specs:
  - {id: CMP-01, name: "input-referred noise (diff rms)",            metric: noise_uV,       unit: uV,    max: 200, corners: typ, test: tb_comp_noise}
  - {id: CMP-13, name: "input-referred noise (diff rms, all corners)", metric: noise_uV,     unit: uV,    max: 240, corners: all, test: tb_comp_noise}
  - {id: CMP-02, name: "systematic offset",                          metric: offset_abs_mV,  unit: mV,    max: 2,   corners: all, test: tb_comp_noise}
  - {id: CMP-03, name: "offset sigma (Monte Carlo, 50 runs)",        metric: offset_sigma_mV, unit: mV,   max: 5,   corners: typ, test: tb_comp_offset_mc, mc: 50}
  - {id: CMP-04, name: "delay CLKC->OUT at 1 mV",                    metric: tdelay_1mV_ps,  unit: ps,    max: 80,  corners: typ, test: tb_comp_delay}
  - {id: CMP-05, name: "delay CLKC->OUT at 1 mV (all corners)",      metric: tdelay_1mV_ps,  unit: ps,    max: 120,  corners: all, test: tb_comp_delay}
  - {id: CMP-06, name: "delay CLKC->OUT at 30 mV",                   metric: tdelay_30mV_ps, unit: ps,    max: 50,  corners: typ, test: tb_comp_delay}
  - {id: CMP-07, name: "regeneration time constant",                 metric: tau_reg_ps,     unit: ps,    max: 15,  corners: all, test: tb_comp_delay}
  - {id: CMP-08, name: "reset time CLKC fall -> both outputs < 10 %", metric: treset_ps,      unit: ps,    max: 35,  corners: all, test: tb_comp_delay}
  - {id: CMP-09, name: "wrong decisions for |vd| >= 100 uV (noise off)", metric: wrong_decisions, unit: count, max: 0, corners: all, test: tb_comp_delay}
  - {id: CMP-10, name: "energy per comparison at 1 mV",              metric: energy_fJ,      unit: fJ,    max: 200, corners: typ, test: tb_comp_delay}
  - {id: CMP-11, name: "differential kickback per cycle on 2.5 pF",  metric: kickback_uV,    unit: uV,    max: 40,  corners: all, test: tb_comp_kickback}
  - {id: CMP-12, name: "input capacitance per input",                metric: cin_fF,         unit: fF,    max: 20,  corners: typ, test: tb_comp_kickback}
  - {id: CMP-14, name: "CLKC input capacitance (charge per rising edge / VDD)", metric: cin_clkc_fF, unit: fF, max: 16, corners: typ, test: tb_comp_kickback}
tests:
  tb_comp_delay:
    netlist: tb/comp/tb_comp_delay.scs
    measure: adcflow.measure.comp:delay
    desc: >
      Ideal differential steps around VCM = 0.49 V: vd = +/-{100m, 30m, 10m, 3m,
      1m, 300u, 100u, 30u, 10u} V, one decision per 400 ps CLKC period, 10 fF
      loads. Transient noise off. Extracts delay vs |vd|, tau_reg (fit of delay
      vs ln|vd|), reset time, decision errors and supply energy per cycle.
  tb_comp_noise:
    netlist: tb/comp/tb_comp_noise.scs
    measure: adcflow.measure.comp:noise
    tran_noise: true
    desc: >
      Transient noise on (behavioral: internal Gaussian). vd swept over
      -800..+800 uV in 17 levels (100 uV steps, about +/-3.3 sigma at the
      all-corner limit), 512 decisions per level. The OUTP counts are fitted
      by binomial maximum likelihood with a probit (Gaussian CDF) model:
      sigma = noise, mean = offset; noise_ci95_uV is the 95 % profile-likelihood
      interval of sigma. The 1-sigma error of sigma is <= 2.7 % for 120..300 uV.
  tb_comp_offset_mc:
    netlist: tb/comp/tb_comp_offset_mc.scs
    measure: adcflow.measure.comp:offset_mc
    # one Spectre montecarlo analysis: local device mismatch only (statistical model sections
    # `models` of the site configuration: TT global, local mismatch), fixed seed, no nominal run
    montecarlo: {runs: 50, seed: 6303, variations: mismatch, models: local_tt}
    desc: >
      Input offset under local device mismatch at TT: one Spectre montecarlo analysis of 50
      samples (seed 6303, samples 1..50, no nominal run) over a transient with transient noise
      off. In every sample a Verilog-A stimulus (tb_offset_search_va) searches the differential
      input at which the decision flips, one decision per 1 ns CLKC cycle around VCM = 0.49 V:
      vd = +25 mV must give OUTP and -25 mV OUTN (else the offset is out of range), 13 halvings of
      [-25, +25] mV (6.1 uV), then offset + 50 uV must give OUTP and offset - 50 uV OUTN (else the
      search did not converge). offset_sigma_mV is the sample standard deviation (n - 1) of the
      offsets. A sample that is out of range, has no valid decision, fails the re-check, ends with
      a simulation error or is missing counts in mc_failed: CMP-03 passes only with all 50 samples
      valid (mc_ok = 50, mc_failed = 0); no sample is dropped. The behavioral comparator has no
      device statistics: while adc_comp is behavioral a series offset source in the testbench gives
      every sample vos_beh * N(0, 1) from the montecarlo mismatch statistics (vos_beh = 2 mV), so
      the search, the Monte Carlo loop and the aggregation run end to end.
  tb_comp_kickback:
    netlist: tb/comp/tb_comp_kickback.scs
    measure: adcflow.measure.comp:kickback
    desc: >
      Inputs floating on 2.5 pF capacitors (the CDAC top plates, C_tot), preset to
      VCM +/- 0.5 mV. Measures the change of the differential input after one
      evaluate + reset cycle. CMP-12: AC current into INP of a second instance
      in reset at 100 MHz. CMP-14: CLKC reaches the DUT through a charge meter (tb_qmeter_va, a 0 V path);
      the charge it draws over each rising edge divided by the voltage step,
      mean over the 8 cycles (window as in adc_cdac tb_cdac_settle).
