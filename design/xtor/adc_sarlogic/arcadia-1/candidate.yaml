name: arcadia-1
description: Self-timed SAR loop without a shift register. Each step's UP/DN latches
  are its token and the next step is enabled only once the comparator has reset and
  both strobes are closed, so one decision per CLKC pulse is structural. CLKC and
  UP/DN are latch nodes driven directly. Every delay (start, DAC waits with the
  per-step extra waits, timeout, RDY) is a chain of resettable ulvt NAND/NOR pairs,
  gate delays only, with no capacitor devices.
status: wip
acknowledged: [39, 61, 79]
