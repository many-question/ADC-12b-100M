name: ci

on:
  push:
    branches: [main, "feat/**", "block/**"]
  pull_request:
  workflow_dispatch:

env:
  # the rnl command per RNL language a file declares; keep in step with tools/adcflow/checks.py RNL_PINNED
  RNL_CORE_0_3: core-v0.5.2     # the last core that reads RNL 0.3
  RNL_CORE_0_4: core-v0.6.2

jobs:
  checks:
    name: contracts, drawings, results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # the candidates check diffs against the base branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install adcflow
        run: pip install -e ".[analysis,dev]"
      - name: Install the rnl CLIs (one per RNL language, pinned, checksum verified)
        run: |
          set -eu
          a=rnl-x86_64-unknown-linux-musl.tar.gz
          for pair in "0.3 $RNL_CORE_0_3" "0.4 $RNL_CORE_0_4"; do
            set -- $pair
            base=https://github.com/rich-netlist/rnl/releases/download/$2
            mkdir -p ".rnl-cli/$1"
            ( cd ".rnl-cli/$1"
              curl -fsSL -o "$a" "$base/$a"
              curl -fsSL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
              grep "  $a$" SHA256SUMS.txt | sha256sum --check -
              tar -xzf "$a"
              ./rnl --version )
          done
      - name: Hygiene (no site data, model cards or large files)
        run: python -m adcflow check hygiene
      - name: Candidates (one candidate per PR, its author, its paths only; netlist and size rules)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$PR_AUTHOR" ]; then
            python -m adcflow check candidates --base "origin/$PR_BASE" --author "$PR_AUTHOR"
          else
            python -m adcflow check candidates
          fi
      - name: Port contracts (specs vs every view, instance and Verilog-A header)
        run: python -m adcflow check ports
      - name: RNL (no errors, no warnings, complete drawings)
        run: python -m adcflow check rnl
      - name: Generated files are up to date
        run: python -m adcflow gen --check
      - name: Recorded results against the current limits
        env:
          PR_BASE: ${{ github.base_ref }}
        run: python -m adcflow check results --strict ${PR_BASE:+--base "origin/$PR_BASE"}
      - name: Unit tests
        run: python -m pytest -q -m "not slow"

  model:
    name: system-model budget (slow)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[analysis,dev]"
      - run: python -m pytest -q -m slow
